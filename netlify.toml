[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Serve uploaded images through the function
[[redirects]]
  from = "/uploads/*"
  to = "/.netlify/functions/media/:splat"
  status = 200

# SPA fallback (hash router, but keeps deep links safe)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
